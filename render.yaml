# One-click deploy on Render: dashboard.render.com -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: aral-inspection
    runtime: node
    plan: starter            # needed for the persistent disk (SQLite database); the free plan loses data on restart
    buildCommand: "true"
    startCommand: node --disable-warning=ExperimentalWarning src/server.js
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/app.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "true"
      - key: BASE_URL
        sync: false          # e.g. https://aral-inspection.onrender.com
      - key: SUPERADMIN_EMAIL
        value: ananader1@gmail.com
      - key: SUPERADMIN_NAME
        value: Anas
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: REQUIRE_2FA
        value: "true"
      - key: SEED_DEMO
        value: "true"        # demo users, inspectors and equipment; set to false before real use
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ananader1@gmail.com
      - key: SMTP_PASS        # Gmail app password (16 letters)
        sync: false
      - key: SMTP_FROM
        value: ARAL Property Inspection Service <ananader1@gmail.com>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock          # demo card checkout; switch to stripe + keys when going live
      - key: BACKUP_KEY
        sync: false          # long random passphrase; encrypts the nightly database backups (keep a copy somewhere safe)
      - key: AI_PROVIDER
        value: gemini        # gemini (Google, free tier) or claude (Anthropic, paid)
      - key: GEMINI_API_KEY
        sync: false          # free key from aistudio.google.com; leave empty to hide the AI buttons
      - key: ANTHROPIC_API_KEY
        sync: false          # only when AI_PROVIDER=claude
      - key: AI_MODEL
        sync: false          # optional; default gemini-3.5-flash-lite (Gemini) or claude-sonnet-5-5 (Claude)
