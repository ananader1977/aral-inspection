<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A R A L · No connection</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;background:#0A1F4A;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center}
img{width:76px;height:76px;border-radius:18px;background:#fff;padding:6px}
h1{font-size:1.3rem;margin:4px 0}p{margin:0;max-width:360px;opacity:.9}.ar{direction:rtl}
button{margin-top:10px;background:#B8743E;color:#fff;border:0;border-radius:10px;padding:12px 28px;font:inherit;font-weight:600}
</style></head>
<body>
<img src="icon.png" alt="">
<h1>No connection</h1>
<p>A R A L needs the internet to open. Photos and notes you already saved in the app are kept on the phone and are sent when you are back online.</p>
<p class="ar">لا يوجد اتصال بالإنترنت. الصور والملاحظات المحفوظة في التطبيق تبقى على الهاتف وتُرسل عند عودة الاتصال.</p>
<button id="retry">Try again · حاول مرة أخرى</button>
<script>document.getElementById('retry').addEventListener('click',function(){location.replace('__APP_URL__');});</script>
</body></html>
