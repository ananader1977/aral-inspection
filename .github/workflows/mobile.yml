# Builds the ARAL phone app in the cloud on every change to mobile/ (or by hand: Actions → Mobile app → Run workflow).
#
# Android: always builds an APK you can install directly (download from the "mobile-latest" release).
#   With the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (and ANDROID_KEY_PASSWORD)
#   it builds a signed APK and the .aab file for Google Play; without them a test APK (debug-signed).
#   GOOGLE_SERVICES_JSON (Firebase) turns on Android notifications.
# iPhone: checks that the app compiles. With the App Store Connect secrets APPSTORE_API_KEY_P8, APPSTORE_API_KEY_ID,
#   APPSTORE_ISSUER_ID and APPLE_TEAM_ID it signs the app and uploads it to TestFlight.
name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: 'ARAL system address the app opens'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_URL: ${{ inputs.app_url || vars.APP_URL || '' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: node scripts/prepare.mjs android
      - name: Build
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          cd android && chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew --no-daemon assembleRelease bundleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            KP="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass pass:"$KP" --out "../out/ARAL-Inspection-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$KP" -signedjar "../out/ARAL-Inspection-$VERSION.aab" app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../out/ARAL-Inspection-$VERSION-test.apk"
          fi
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out/*
      - name: Publish to the "mobile-latest" download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-latest >/dev/null 2>&1 || gh release create mobile-latest --prerelease --title "ARAL mobile app (latest build)" --notes "Latest build of the ARAL staff app. Android: open this page on the phone and tap the .apk file to install. iPhone builds go to TestFlight."
          gh release upload mobile-latest out/* --clobber
          gh release edit mobile-latest --notes "Latest build of the ARAL staff app: version $(node -p "require('./package.json').version"), build ${BUILD_NUMBER}, commit ${GITHUB_SHA::7}. Android: open this page on the phone and tap the .apk file to install. iPhone builds go to TestFlight."

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      ASC_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare iOS project
        run: node scripts/prepare.mjs ios
      - name: Check that the app compiles (no Apple account needed)
        if: env.ASC_KEY == ''
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Sign and upload to TestFlight
        if: env.ASC_KEY != ''
        run: |
          set -e
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive | tail -30
          P="$RUNNER_TEMP/export.plist"
          plutil -create xml1 "$P"
          plutil -insert method -string app-store-connect "$P"
          plutil -insert destination -string upload "$P"
          plutil -insert teamID -string "$TEAM_ID" "$P"
          plutil -insert signingStyle -string automatic "$P"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$P"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$P" -exportPath "$RUNNER_TEMP/export" $AUTH
          echo "Uploaded. It appears in App Store Connect → TestFlight after Apple finishes processing (10–30 minutes)."
